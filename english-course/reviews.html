</head>
<body>
  <!-- 상단 내비게이션 -->
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">Speak<span>Up</span></a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="nav-menu">
      <a href="courses.html">강의</a>
      <a href="instructor.html">강사 소개</a>
      <a href="reviews.html" class="active" aria-current="page">수강 후기</a>
      <a href="faq.html">FAQ</a>
        <a href="signup.html" class="btn btn-small">무료 체험</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 수강 후기 -->
    <section id="reviews" class="section">
      <div class="container">
        <h1 class="section-title">수강생 후기</h1>
        <div class="slider">
          <button class="slide-btn prev" aria-label="이전 후기">‹</button>
          <div class="slides">
            <blockquote class="slide active">
              <p>"외국인 동료에게 먼저 말을 건 게 처음이에요. 매일 20분이 이렇게 큰 차이를 만들 줄 몰랐어요."</p>
              <cite>— 김민지, 직장인 · 중급반</cite>
            </blockquote>
            <blockquote class="slide">
              <p>"발음 클리닉 듣고 나서 제 영어를 녹음해 듣는 게 더 이상 부끄럽지 않아요."</p>
              <cite>— 이준호, 대학생 · 입문반</cite>
            </blockquote>
            <blockquote class="slide">
              <p>"해외 컨퍼런스 발표를 무사히 마쳤습니다. 발표 구조 잡는 법이 정말 유용했어요."</p>
              <cite>— 박서연, 마케터 · 고급반</cite>
            </blockquote>
          </div>
          <button class="slide-btn next" aria-label="다음 후기">›</button>
        </div>
        <div class="dots"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 SpeakUp English. All rights reserved.</p>
    </div>

  <button class="to-top" aria-label="맨 위로">↑</button>

  <script src="js/common.js"></script>
  <script src="js/reviews.js"></script>

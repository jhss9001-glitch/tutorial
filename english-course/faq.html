  <main>
    <!-- FAQ -->
    <section id="faq" class="section">
      <div class="container narrow">
        <h1 class="section-title">자주 묻는 질문</h1>
        <div class="faq-item">
          <button class="faq-q">수업은 어떤 방식으로 진행되나요?<span>+</span></button>
          <div class="faq-a"><p>녹화 강의 + 주 1회 라이브 스피킹 세션으로 진행됩니다. 강의는 언제든 다시 볼 수 있어요.</p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q">제 레벨을 잘 모르겠어요.<span>+</span></button>
          <div class="faq-a"><p>무료 체험 신청 시 5분 레벨 테스트를 제공하고, 결과에 맞는 강의를 추천해 드립니다.</p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q">환불이 가능한가요?<span>+</span></button>
          <div class="faq-a"><p>결제 후 7일 이내, 수강 진도 20% 미만이면 전액 환불해 드립니다.</p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q">모바일로도 들을 수 있나요?<span>+</span></button>
          <div class="faq-a"><p>네, PC·태블릿·스마트폰 어디서든 수강할 수 있습니다.</p></div>
        </div>
      </div>
    </section>
